<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Buscador de Polo - São Raimundo Nonato</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
<style>
body { padding:20px; background:#eef2f7 }
.card { border-radius:10px }
</style>
</head>
<body>
<div class="container">
<h2>Buscador de Polo</h2>

<div class="card p-3 mt-3">
<h5>Pesquisar Cidade</h5>
<input id="busca" class="form-control" placeholder="Digite o nome da cidade..." list="listaCidades" />
<datalist id="listaCidades"></datalist>

<button class="btn btn-primary mt-2" onclick="pesquisar()">Pesquisar</button>

<div id="saida" class="mt-3"></div>
</div>
</div>

<script>
// Banco de dados
const fullData = [
{ cidade:'São Raimundo Nonato', sub:'RN1' },
{ cidade:'Dom Inocêncio', sub:'RN1' },
{ cidade:'Dirceu Arcoverde', sub:'RN1' },
{ cidade:'Anísio de Abreu', sub:'RN1' },
{ cidade:'Caracol', sub:'RN1' },
{ cidade:'Guaribas', sub:'RN1' },
{ cidade:'Jurema', sub:'RN1' },
{ cidade:'Várzea Branca', sub:'RN1' },
{ cidade:'Bonfim', sub:'RN1' },
{ cidade:'São Brás do Piauí', sub:'RN1' },
{ cidade:'São Lourenço do Piauí', sub:'RN1' },

{ cidade:'Canto do Buriti', sub:'RN2' },
{ cidade:'Brejo do Piauí', sub:'RN2' },
{ cidade:'Tamboril do Piauí', sub:'RN2' },
{ cidade:'Rio Grande do Piauí', sub:'RN2' },
{ cidade:'Flores do Piauí', sub:'RN2' },
{ cidade:'Ribeiro do Piauí', sub:'RN2' },
{ cidade:'Itainópolis', sub:'RN2' },
{ cidade:'Pavussu', sub:'RN2' },

{ cidade:'São João do Piauí', sub:'RN3' },
{ cidade:'João Costa', sub:'RN3' },
{ cidade:'Pedro Laurentino', sub:'RN3' },
{ cidade:'Coronel José Dias', sub:'RN3' },
{ cidade:'Nova Santa Rita', sub:'RN3' },

{ cidade:'Campo Alegre do Fidalgo', sub:'RN4' },
{ cidade:'Lagoa do Barro', sub:'RN4' },
{ cidade:'Capitão Gervásio Oliveira', sub:'RN4' },
{ cidade:'São Francisco de Assis do Piauí', sub:'RN4' },
{ cidade:'Queimada Nova', sub:'RN4' }
];

// Função para remover acentos
function normalize(t){
    return t.normalize("NFD").replace(/\p{Diacritic}/gu,"").toLowerCase();
}

// Autocomplete da lista
const input = document.getElementById('busca');
const lista = document.getElementById('listaCidades');

input.addEventListener('input', () => {
    const termo = normalize(input.value.trim());
    lista.innerHTML = '';

    if (termo.length === 0) return;

    const sugestoes = fullData.filter(c =>
        normalize(c.cidade).includes(termo)
    );

    sugestoes.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.cidade;
        lista.appendChild(opt);
    });
});

// Função de pesquisa
function pesquisar(){
    const termo = normalize(document.getElementById("busca").value.trim());
    const resultados = fullData.filter(c =>
        normalize(c.cidade).includes(termo)
    );

    const saida = document.getElementById("saida");

    if (resultados.length === 0){
        saida.innerHTML = `<div class='alert alert-danger'>Cidade não encontrada.</div>`;
        return;
    }

    const r = resultados[0];

    saida.innerHTML = `
        <div class='alert alert-success'>
            <b>Cidade:</b> ${r.cidade}<br>
            <b>Polo:</b> São Raimundo Nonato<br>
            <b>Subpolo:</b> ${r.sub}
        </div>
    `;
}
</script>
</body>
</html>
